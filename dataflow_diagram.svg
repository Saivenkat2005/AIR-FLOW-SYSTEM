<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="650" rx="16" fill="url(#bgGrad2)"/>
  <text x="600" y="45" font-family="Calibri, Arial, sans-serif" font-size="24" font-weight="bold" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">DETAILED DATA FLOW &amp; TRAFFIC ROUTING PIPELINE</text>

  <!-- Step 1: North-South Ingress -->
  <g transform="translate(50, 90)" filter="url(#shadow2)">
    <rect width="240" height="490" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <rect width="240" height="36" rx="10" fill="#4338ca"/>
    <text x="120" y="24" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. INGRESS &amp; ROUTING</text>

    <rect x="15" y="55" width="210" height="95" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
    <text x="120" y="78" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">Client HTTP/S Request</text>
    <text x="120" y="98" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Port 80/443 (Edge)</text>
    <text x="120" y="118" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">TLS Handshake &amp; WAF</text>
    <text x="120" y="136" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">nexus.airlines.com</text>

    <rect x="15" y="165" width="210" height="135" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <text x="120" y="188" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#818cf8" text-anchor="middle">Istio VirtualService</text>
    <text x="120" y="210" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Prefix Pattern Matching:</text>
    <text x="120" y="230" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">• /api/ai  → ai-service:8000</text>
    <text x="120" y="250" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#facc15" text-anchor="middle">• /api/v1/booking → core (90/10)</text>
    <text x="120" y="270" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">• /api/* → api-gateway:4000</text>
    <text x="120" y="290" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Timeout: 10s | Retries: 2</text>

    <rect x="15" y="315" width="210" height="150" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="120" y="338" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">API Gateway Layer</text>
    <text x="120" y="360" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Persona Role Validation</text>
    <text x="120" y="380" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Rate Limit Token Bucket</text>
    <text x="120" y="400" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Correlation ID Injection</text>
    <text x="120" y="420" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Upstream Proxy Forward</text>
    <text x="120" y="445" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Node.js Express / Nexus</text>
  </g>

  <!-- Step 2: Mesh Security & Canary -->
  <g transform="translate(330, 90)" filter="url(#shadow2)">
    <rect width="270" height="490" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="270" height="36" rx="10" fill="#7e22ce"/>
    <text x="135" y="24" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. ZERO-TRUST SERVICE MESH</text>

    <rect x="15" y="55" width="240" height="120" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="135" y="78" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">PeerAuthentication Policy</text>
    <text x="135" y="98" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">mode: STRICT (mTLS Enforced)</text>
    <text x="135" y="118" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Automatic X.509 Cert Rotation</text>
    <text x="135" y="138" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• SPIFFE ID Service Identity</text>
    <text x="135" y="158" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#f87171" text-anchor="middle">Plaintext / Rogue traffic REJECTED</text>

    <rect x="15" y="190" width="240" height="135" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="135" y="213" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#facc15" text-anchor="middle">Canary Traffic Splitting</text>
    <text x="135" y="235" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">90% → core-service:v1 (Stable)</text>
    <text x="135" y="255" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#facc15" text-anchor="middle">10% → core-service:v2 (Canary)</text>
    <text x="135" y="275" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Fault Injection: 0.1% / 500ms delay</text>
    <text x="135" y="295" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Zero-downtime rolling upgrades</text>

    <rect x="15" y="340" width="240" height="125" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="135" y="363" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">DestinationRule &amp; Resilience</text>
    <text x="135" y="385" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Connection Pool: 250 TCP / 100 HTTP</text>
    <text x="135" y="405" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Circuit Breaker: 3 consecutive 5xx</text>
    <text x="135" y="425" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Ejection Window: 30s base time</text>
    <text x="135" y="445" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Prevents Cascading Service Failure</text>
  </g>

  <!-- Step 3: Core Microservice Processing -->
  <g transform="translate(640, 90)" filter="url(#shadow2)">
    <rect width="250" height="490" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="250" height="36" rx="10" fill="#059669"/>
    <text x="125" y="24" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. BUSINESS PROCESSING</text>

    <rect x="15" y="55" width="220" height="125" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="125" y="78" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">Spring Boot Core Engine</text>
    <text x="125" y="100" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Flight Inventory &amp; Schedule</text>
    <text x="125" y="120" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Dynamic 3D Seat Allocator</text>
    <text x="125" y="140" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Overbooking Rebalance Engine</text>
    <text x="125" y="160" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Java 21 | Spring Data JPA</text>

    <rect x="15" y="195" width="220" height="125" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <text x="125" y="218" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#22d3ee" text-anchor="middle">FastAPI AI Assistant</text>
    <text x="125" y="240" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Semantic Flight Search Query</text>
    <text x="125" y="260" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Dynamic Seat Upgrade Advisor</text>
    <text x="125" y="280" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Policy &amp; Baggage Guidance</text>
    <text x="125" y="300" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Python 3.11 | Uvicorn Worker</text>

    <rect x="15" y="335" width="220" height="130" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="125" y="358" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">Kafka Event Publisher</text>
    <text x="125" y="380" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Emits BOOKING_CREATED</text>
    <text x="125" y="400" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Emits PAYMENT_PROCESSED</text>
    <text x="125" y="420" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Triggers Notification Workers</text>
    <text x="125" y="445" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Asynchronous Event-Driven Flow</text>
  </g>

  <!-- Step 4: Storage & Telemetry -->
  <g transform="translate(930, 90)" filter="url(#shadow2)">
    <rect width="220" height="490" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <rect width="220" height="36" rx="10" fill="#c2410c"/>
    <text x="110" y="24" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4. DATA &amp; TRACING</text>

    <rect x="15" y="55" width="190" height="95" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="110" y="78" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">MySQL 8.0 &amp; Redis 7</text>
    <text x="110" y="98" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• ACID Booking Transactions</text>
    <text x="110" y="118" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Sub-10ms Redis Caching</text>
    <text x="110" y="136" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Composite Flight Indexes</text>

    <rect x="15" y="165" width="190" height="150" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="188" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Full-Stack Observability</text>
    <text x="110" y="210" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Prometheus: P99 Latency</text>
    <text x="110" y="230" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Grafana: Live Health Boards</text>
    <text x="110" y="250" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Loki: Centralized Log Stream</text>
    <text x="110" y="270" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Tempo: Distributed Traces</text>
    <text x="110" y="295" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">Kiali Service Topology</text>

    <rect x="15" y="330" width="190" height="135" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>
    <text x="110" y="353" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Verification Metrics</text>
    <text x="110" y="375" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Latency: 42ms (Cache)</text>
    <text x="110" y="395" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Throughput: 250+ req/s</text>
    <text x="110" y="415" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">• Error Rate: 0.00%</text>
    <text x="110" y="440" font-family="Calibri, Arial, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">100% Test Pass Rate</text>
  </g>
</svg>
