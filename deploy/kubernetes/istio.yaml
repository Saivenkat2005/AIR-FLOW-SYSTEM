apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: airline-nexus-mtls
  namespace: airline-nexus
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: airline-nexus-gateway
  namespace: airline-nexus
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - airline-nexus.example.com
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: airline-nexus-routes
  namespace: airline-nexus
spec:
  hosts:
    - airline-nexus.example.com
  gateways:
    - airline-nexus-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: api-gateway
            port:
              number: 4000
      timeout: 8s
      retries:
        attempts: 2
        perTryTimeout: 3s
        retryOn: connect-failure,reset,503
