name: airline-nexus

x-logging: &default-logging
  driver: "loki"
  options:
    loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
    loki-retries: 2
    loki-max-backoff: 800ms
    loki-timeout: 1s
    keep-file: "true"

services:
  mysql:
    image: mysql:8.0
    container_name: aerofast_mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: airlines
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - data-network

  redis:
    image: redis:7-alpine
    container_name: aerofast_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes: 
      - redis_data:/data
    networks:
      - data-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: aerofast_zookeeper
    profiles: ["infrastructure"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: aerofast_kafka
    profiles: ["infrastructure"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - data-network

  prometheus:
    image: prom/prometheus:latest
    container_name: aerofast_prometheus
    profiles: ["observability"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal-network

  grafana:
    image: grafana/grafana:latest
    container_name: aerofast_grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - internal-network

  loki:
    image: grafana/loki:latest
    container_name: aerofast_loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal-network

  tempo:
    image: grafana/tempo:latest
    container_name: aerofast_tempo
    profiles: ["observability"]
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "4317:4317"
    networks:
      - internal-network

  api-gateway:
    build:
      context: ./Backend-Nexus/api-gateway
      dockerfile: Dockerfile
    container_name: aerofast_api_gateway
    ports:
      - "4000:4000"
    environment:
      - CORE_SERVICE_URL=http://core-service:8080
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      core-service:
        condition: service_started
      ai-service:
        condition: service_healthy
    networks:
      - public-network
      - internal-network

  core-service:
    build:
      context: ./Backend/airlines
      dockerfile: Dockerfile
    container_name: aerofast_core_service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airlines
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data-network
      - internal-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aerofast_ai_service
    ports:
      - "8000:8000"
    environment:
      - JAVA_API_URL=http://core-service:8080
      - AI_API_KEY=${AI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network
      - data-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: aerofast_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - api-gateway
    networks:
      - public-network

networks:
  public-network:
    driver: bridge
  internal-network:
    driver: bridge
  data-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
